[package]
name = "mbsim"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.21", features = ["rt", "macros", "signal", "sync", "time"] }
tokio-modbus = { version = "0.5", default-features = false, features = ["tcp-server-unstable"] }
clap = { version = "4", features = ["derive"] }
futures = { version = "0.3" }
futures-util = { version = "0.3" }
sync_wrapper = "0.1"
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
